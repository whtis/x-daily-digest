(D.stocks||[]).forEach((c,i)=>{toc+=`<a href="#c${i}">${e(c.title)}</a>`;h+=`<section class="card" id="c${i}"><h3>${e(c.title)}</h3><div class="chips">${(c.tickers||[]).map(x=>`<span class="chip">${e(x)}</span>`).join('')}${(c.tags||[]).map(x=>`<span class="tag ${e(x.type)}">${e(x.text)}</span>`).join('')}</div>${c.summary?`<p>${X(c.summary)}</p>`:''}${c.steps&&c.steps.length?`<div class="steps">${c.steps.map(s=>`<div class="step"><b>${X(s.title)}</b>${X(s.body)}</div>`).join('')}</div>`:''}${c.points&&c.points.length?`<ul>${c.points.map(p=>`<li>${X(p)}</li>`).join('')}</ul>`:''}${c.links&&c.links.length?`<div class="links">来源：${c.links.map(L).join(' · ')}</div>`:''}${c.take||c.risk?`<div class="call">${c.take?`<b>💡 我的看法</b>${X(c.take)}`:''}${c.risk?`<b style="margin-top:6px">⚠️ 风险</b>${X(c.risk)}`:''}</div>`:''}</section>`});
h+='<h2 id="o">🗂 其他内容</h2><div class="grid">'+(D.others||[]).map(g=>`<div class="card"><h4>${e(g.category)}</h4><ul>${g.items.map(x=>`<li>${typeof x=='string'?X(x):e(x.text)+(x.url?' '+L({text:'↗',url:x.url}):'')}</li>`).join('')}</ul></div>`).join('')+'</div>';
toc+='<a href="#o">其他内容</a>';h+=D.oneliner?`<div class="card one">${X(D.oneliner)}</div>`:'';main.innerHTML=h+(D.meta?`<p class="links" style="margin-top:20px">${e(D.meta)}</p>`:'');toc_=document.getElementById('toc');toc_.innerHTML+=toc;
</script></body></html>
