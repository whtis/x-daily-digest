<!DOCTYPE html>
<!--
  X 每日研报模板 · 填充说明
  1. 复制为 YYYY-MM-DD.html，只替换 <script id="digest-data"> 内的 JSON，其余不动。
  2. 引用写法：任何文本中写 [[帖子URL]]，会自动编号成上标脚注 ¹，并汇总到页尾“来源”。
  3. Schema：
     date, dateLabel, title, summary, takeaway, disclaimer
     keynums[{label,value,delta,dir:"up|down|flat"}]
     themes[{cat:"ai|semi|index|tsla|crypto|macro", label, title, tickers[], narrative[段落],
             bull[], bear[]（可省略）, levels[[名称,说明]], levelSrc（可选，引用串）, watch[]}]
     methods[{title, tag, src（引用串）, logic, conditions[], rules[], risk}]
     watchlist[[ticker, 主题, "bull|bear|flat", 要点, 引用串]]
     news[{cat, items[]}]
     verdict（页首方向判断，可省略）{label:"偏多|偏空|震荡偏空…", tone:"bull|bear|flat", confidence, horizon,
             tally{bull[博主], neutral[], bear[], note}, reasons[2–3], flip[触发反转的信号], summary（2–3 句当日总结）}
       tally 只统计对方向明确表态的博主，如实计数。
  4. 只用当天摘要里的事实与数字；不要编造。
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>X 每日研报</title>
<style>

@media(prefers-color-scheme:dark){:root{--bg:#0c0d10;--panel:#131418;--ink:#ececef;--ink2:#b9bcc4;--mute:#7c808a;--line:#23252b;--soft:#1a1b20;--acc:#8b8bff;--accs:#1d1d36;--up:#3ccf8e;--down:#ff6b6b;--ups:#10261d;--downs:#2b1414;--ai:#a48bff;--semi:#69a3ff;--index:#3cc7bd;--tsla:#e3a447;--crypto:#f08a55}}

.top .w{display:flex;align-items:center;gap:24px;height:52px}.brand{font-weight:650;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px;text-decoration:none}.brand i{width:8px;height:8px;border-radius:2px;background:var(--acc);display:inline-block}

.theme{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:36px 40px;margin-bottom:24px;position:relative;scroll-margin-top:70px}
.theme:before{content:"";position:absolute;left:0;top:36px;width:3px;height:28px;border-radius:0 3px 3px 0;background:var(--c)}
.cat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--c)}.cat:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

.tk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}.tk span{font:500 12px/1 ui-monospace,"SF Mono",Menlo,monospace;padding:6px 8px;border-radius:6px;background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.nar p{margin:0 0 14px;color:var(--ink2)}.nar p:first-child{color:var(--ink)}
.bb{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0}.bb.one{grid-template-columns:1fr}.side{border-radius:12px;padding:18px 20px;border:1px solid var(--line)}
.side h4{margin:0 0 10px;font-size:13px;font-weight:650;letter-spacing:.02em;display:flex;align-items:center;gap:8px}.bull h4{color:var(--up)}.bear h4{color:var(--down)}
.bull{background:var(--ups);border-color:transparent}.bear{background:var(--downs);border-color:transparent}
.side ul,.m ul,.watch ul{margin:0;padding:0;list-style:none}.side li{position:relative;padding-left:16px;margin:7px 0;font-size:14.5px;line-height:1.75;color:var(--ink2)}.side li:before{content:"";position:absolute;left:2px;top:.75em;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45}

.lv dl{margin:0}.lv dl div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.lv dt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.lv dd{margin:0;color:var(--ink2);text-align:right}
.watch li{font-size:14px;padding:6px 0 6px 22px;position:relative;color:var(--ink2)}.watch li:before{content:"→";position:absolute;left:0;color:var(--acc)}
.ms{display:grid;grid-template-columns:1fr 1fr;gap:20px}.m{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.m .tag{font-size:11.5px;font-weight:600;color:var(--acc);background:var(--accs);padding:3px 9px;border-radius:5px}.m h3{font-size:18.5px;margin:12px 0 10px;letter-spacing:-.01em}
.m .lg{font-size:14.5px;color:var(--ink2);margin:0 0 16px}.row{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row>b{font-size:12px;color:var(--mute);font-weight:600;padding-top:2px}.row li{font-size:14px;line-height:1.7;margin:0 0 6px;padding-left:14px;position:relative}.row li:before{content:"";position:absolute;left:0;top:.7em;width:6px;height:1.5px;background:var(--mute)}
.row.rk{color:var(--down)}.row.rk p{margin:0;font-size:14px;color:var(--ink2)}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:13px 18px;background:var(--soft);border-bottom:1px solid var(--line)}td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}tr:last-child td{border:0}
td.t{font:600 13px ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink);white-space:nowrap}.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}.st.bull{color:var(--up)}.st.bear{color:var(--down)}.st.flat{color:var(--mute);background:var(--soft)}
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.nc h4{font-size:13px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}.nc li{font-size:14px;color:var(--ink2);margin:0 0 10px;line-height:1.7}.nc ul{margin:0;padding:0;list-style:none}
sup.c a{font-size:10.5px;color:var(--mute);text-decoration:none;padding:0 1.5px;font-variant-numeric:tabular-nums}sup.c a:hover{color:var(--acc)}
.src{margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}.src summary{cursor:pointer;font-size:13px;color:var(--mute)}.src ol{columns:3;column-gap:28px;font-size:12px;color:var(--mute);padding-left:22px;margin-top:14px}.src li{break-inside:avoid;margin:0 0 4px;scroll-margin-top:80px}.src a{color:var(--mute);text-decoration:none}.src a:hover{color:var(--acc)}.src li:target{color:var(--acc)}
footer{padding:32px 0 64px;font-size:12.5px;color:var(--mute);line-height:1.8}
@media(max-width:860px){.nums{grid-template-columns:repeat(3,1fr)}.num:nth-child(3){border-right:0}.num:nth-child(-n+3){border-bottom:1px solid var(--line)}.ms,.news{grid-template-columns:1fr}.src ol{columns:2}}
@media(max-width:640px){body{font-size:15px}.w{padding:0 18px}.top .w{gap:12px}.brand span{display:none}.hero{padding:40px 0 28px}h1{font-size:29px}.summary{font-size:16px}
.nums{grid-template-columns:1fr 1fr}.num{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}.num:nth-child(2n){border-right:0!important}.num:nth-last-child(-n+2){border-bottom:0}.num b{font-size:19px}
.theme{padding:24px 20px;border-radius:14px}.theme:before{top:26px}.theme h3{font-size:20px}.bb,.lv{grid-template-columns:1fr;gap:12px}.lv{gap:22px}.m{padding:22px 18px}
.take{flex-direction:column;gap:4px}.sh h2{font-size:22px}.vd{margin-top:40px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 34px;display:grid;grid-template-columns:260px 1fr;gap:34px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 30px -12px rgba(30,30,80,.12)}
.vk{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--mute)}.badge{display:inline-flex;align-items:center;gap:10px;margin:12px 0 8px;font-size:30px;font-weight:700;letter-spacing:-.02em;padding:8px 18px 8px 14px;border-radius:12px}
.badge.bear{color:var(--down);background:var(--downs)}.badge.bull{color:var(--up);background:var(--ups)}.badge.flat{color:var(--ink2);background:var(--soft)}.badge:before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.cf{font-size:13px;color:var(--ink2)}.cf b{color:var(--ink)}.gauge{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:20px 0 10px;gap:2px}.gauge i{display:block}.g1{background:var(--up)}.g2{background:var(--mute);opacity:.45}.g3{background:var(--down)}
.tl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}.tl b{font-size:16px;color:var(--ink);margin-right:3px}.tn{font-size:11.5px;color:var(--mute);margin-top:12px;line-height:1.65}
.vr h4{font-size:12px;letter-spacing:.06em;color:var(--mute);margin:0 0 8px;font-weight:600}.vr ol{margin:0 0 18px;padding-left:20px}.vr li{font-size:14.5px;color:var(--ink2);margin:0 0 6px}
.fl{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}.fl div{font-size:14px;color:var(--ink2);padding:8px 12px;border-radius:9px;background:var(--soft)}
.vs{font-size:15px;line-height:1.85;color:var(--ink);border-top:1px solid var(--line);padding-top:16px;margin:0}.vl{grid-column:1/-1;font-size:11.5px;color:var(--mute);margin-top:-18px}
@media(max-width:760px){.vd{grid-template-columns:1fr;padding:22px 20px;gap:22px;margin-top:24px}.badge{font-size:26px}.vl{margin-top:-8px}}
section.blk{padding-top:44px}
.tbl{border-radius:12px}table,tbody,tr,td{display:block}thead{display:none}tr{padding:14px 16px;border-bottom:1px solid var(--line)}td{padding:2px 0;border:0}td.t{display:inline-block;margin-right:8px}td.th2{display:inline;font-size:12px;color:var(--mute)}td.s{float:right}.src ol{columns:1}}
</style></head><body>
<div class="top"><div class="w"><a class="brand" href="index.html"><i></i>X 每日研报<span id="bd"></span></a><nav id="nav"></nav></div></div>
<main class="w" id="app"></main>
<script id="digest-data" type="application/json">
{"date":"YYYY-MM-DD","dateLabel":"日期占位","title":"标题占位","summary":"执行摘要占位 [[https://x.com/]]","keynums":[{"label":"QQQ","value":"—","delta":"","dir":"flat"}],"takeaway":"一句话占位","themes":[],"methods":[],"watchlist":[],"news":[],"disclaimer":"仅供学习，不构成投资建议。"}
</script>
<script>
(function(){const D=JSON.parse(document.getElementById('digest-data').textContent);const S=[],I={};
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const X=s=>e(s).replace(/\s*\[\[(https?:\/\/[^\]\s]+)\]\]/g,(m,u)=>{if(!I[u]){S.push(u);I[u]=S.length}const n=I[u];return `<sup class="c"><a href="${u}" target="_blank" rel="noopener" title="${(u.match(/x\.com\/([^/]+)/)||[,'来源'])[1]}">${n}</a></sup>`}).replace(/<\/sup><sup class="c">/g,'</sup><sup class="c">');
const li=a=>(a||[]).map(x=>`<li>${X(x)}</li>`).join('');let h='',nav='';
document.title='X 每日研报 · '+D.date;document.getElementById('bd').textContent=' · '+D.date;
if(D.verdict){const v=D.verdict,T=v.tally||{},b=(T.bull||[]).length,n=(T.neutral||[]).length,r=(T.bear||[]).length,s=b+n+r||1;
h+=`<section class="vd" aria-label="方向判断"><div><div class="vk">市场方向 · ${e(v.horizon)}</div><div class="badge ${e(v.tone)}">${e(v.label)}</div><div class="cf">置信度 <b>${e(v.confidence)}</b></div>
<div class="gauge"><i class="g1" style="flex:${b}"></i><i class="g2" style="flex:${n}"></i><i class="g3" style="flex:${r}"></i></div>
<div class="tl"><span><b>${b}</b>偏多</span><span><b>${n}</b>中性</span><span><b>${r}</b>偏空</span></div>
<div class="tn" title="偏多：${e((T.bull||[]).join('、'))}｜中性：${e((T.neutral||[]).join('、'))}｜偏空：${e((T.bear||[]).join('、'))}">偏多：${e((T.bull||[]).join('、'))}<br>中性：${e((T.neutral||[]).join('、'))}<br>偏空：${e((T.bear||[]).join('、'))}<br>${e(T.note||'')}</div></div>
<div class="vr"><h4>判断依据</h4><ol>${li(v.reasons)}</ol><h4>什么信号会改变判断</h4><div class="fl">${(v.flip||[]).map(x=>`<div>${X(x)}</div>`).join('')}</div><p class="vs">${X(v.summary)}</p></div>
<div class="vl">以上为助手对博主观点的综合判断，并非投资建议。</div></section>`}
h+=`<header class="hero"><div class="eyebrow">${e(D.dateLabel)}</div><h1>${e(D.title)}</h1><p class="summary">${X(D.summary)}</p>
<div class="nums">${(D.keynums||[]).map(k=>`<div class="num"><small>${e(k.label)}</small><b>${e(k.value)}</b><span class="${e(k.dir)}">${e(k.delta)||'&nbsp;'}</span></div>`).join('')}</div>
${D.takeaway?`<div class="take"><b>今日要点</b><div>${X(D.takeaway)}</div></div>`:''}</header>`;
if(D.themes&&D.themes.length){nav+='<a href="#themes">主线</a>';h+=`<section class="blk" id="themes"><div class="sh"><h2>今日主线</h2><span>${D.themes.length} 个主题</span></div>`;
D.themes.forEach((t,i)=>{h+=`<article class="theme" id="t${i}" style="--c:var(--${e(t.cat)})"><div class="cat">${e(t.label)}</div><h3>${e(t.title)}</h3>
<div class="tk">${(t.tickers||[]).map(x=>`<span>${e(x)}</span>`).join('')}</div><div class="nar">${(t.narrative||[]).map(p=>`<p>${X(p)}</p>`).join('')}</div>
${(t.bull&&t.bull.length)||(t.bear&&t.bear.length)?`<div class="bb${t.bull&&t.bull.length&&t.bear&&t.bear.length?'':' one'}">${t.bull&&t.bull.length?`<div class="side bull"><h4>▲ 多方观点</h4><ul>${li(t.bull)}</ul></div>`:''}${t.bear&&t.bear.length?`<div class="side bear"><h4>▼ 空方 / 风险</h4><ul>${li(t.bear)}</ul></div>`:''}</div>`:''}
<div class="lv"><div><h4>关键数字与点位${t.levelSrc?X(t.levelSrc):''}</h4><dl>${(t.levels||[]).map(l=>`<div><dt>${e(l[0])}</dt><dd>${X(l[1])}</dd></div>`).join('')}</dl></div><div class="watch"><h4>接下来看什么</h4><ul>${li(t.watch)}</ul></div></div></article>`});h+='</section>'}
if(D.methods&&D.methods.length){nav+='<a href="#methods">方法</a>';h+=`<section class="blk" id="methods"><div class="sh"><h2>值得学的方法</h2><span>逻辑 · 条件 · 规则 · 风险</span></div><div class="ms">`;
D.methods.forEach(m=>{h+=`<div class="m"><span class="tag">${e(m.tag)}</span><h3>${e(m.title)}${X(m.src||'')}</h3><p class="lg">${X(m.logic)}</p>
${m.conditions&&m.conditions.length?`<div class="row"><b>条件</b><ul>${li(m.conditions)}</ul></div>`:''}${m.rules&&m.rules.length?`<div class="row"><b>规则</b><ul>${li(m.rules)}</ul></div>`:''}${m.risk?`<div class="row rk"><b>风险</b><p>${X(m.risk)}</p></div>`:''}</div>`});h+='</div></section>'}
if(D.watchlist&&D.watchlist.length){nav+='<a href="#watch">观察表</a>';const L={bull:'偏多',bear:'偏空',flat:'中性'};h+=`<section class="blk" id="watch"><div class="sh"><h2>观察清单</h2><span>${D.watchlist.length} 个标的</span></div><div class="tbl"><table><thead><tr><th>标的</th><th>主题</th><th>倾向</th><th>要点</th></tr></thead><tbody>
${D.watchlist.map(r=>`<tr><td class="t">${e(r[0])}</td><td class="th2">${e(r[1])}</td><td class="s"><span class="st ${e(r[2])}">${L[r[2]]||e(r[2])}</span></td><td>${X(r[3]+(r[4]||''))}</td></tr>`).join('')}</tbody></table></div></section>`}
if(D.news&&D.news.length){nav+='<a href="#news">其他</a>';h+=`<section class="blk" id="news"><div class="sh"><h2>其他值得一看</h2></div><div class="news">${D.news.map(n=>`<div class="nc"><h4>${e(n.cat)}</h4><ul>${li(n.items)}</ul></div>`).join('')}</div></section>`}
h+=`<details class="src"><summary>来源 · ${S.length} 条原帖（点击展开）</summary><ol>${S.map((u,i)=>`<li id="s${i+1}"><a href="${u}" target="_blank" rel="noopener">@${e((u.match(/x\.com\/([^/]+)/)||[,u])[1])}</a></li>`).join('')}</ol></details>
<footer>${e(D.disclaimer)}<br>内容整理自 X 公开帖子，正文上标数字为原帖链接。</footer>`;
document.getElementById('app').innerHTML=h;document.getElementById('nav').innerHTML=nav;})();
</script></body></html>
